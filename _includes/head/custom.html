<!-- ① 尽早定语言，避免首屏闪烁 -->
<script>
  (function () {
    try {
      var l = localStorage.getItem("bi4wms-lang");
      if (l !== "zh" && l !== "en") {
        l = ((navigator.language || "").toLowerCase().indexOf("zh") === 0) ? "zh" : "zh";
      }
      document.documentElement.setAttribute("data-lang", l);
      document.documentElement.lang = (l === "zh") ? "zh-CN" : "en";
    } catch (e) {}
  })();
</script>

<!-- ② 样式：切换按钮 + 双语区块显隐 -->
<style>
  /* ---- 切换按钮 ---- */
  .bi-lang {
    display: inline-flex;
    align-items: center;
    flex: 0 0 auto;
    margin-left: auto;
    white-space: nowrap;
    border: 1px solid #22302c;
    background: #131c1f;
  }
  .bi-lang button {
    -webkit-appearance: none;
    appearance: none;
    background: transparent;
    border: 0;
    cursor: pointer;
    padding: .34em .68em;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-size: .68rem;
    font-weight: 700;
    letter-spacing: .1em;
    line-height: 1.4;
    color: #74837d;
  }
  .bi-lang button + button { border-left: 1px solid #22302c; }
  .bi-lang button:hover { color: #2fe08a; }
  .bi-lang button.on { background: #2fe08a; color: #04120b; }
  .bi-lang button:focus-visible { outline: 2px solid #ffb454; outline-offset: -2px; }

  /* ---- 双语区块：正文写两份时用 ---- */
  html[data-lang="zh"] .lang-en { display: none !important; }
  html[data-lang="en"] .lang-zh { display: none !important; }
  html:not([data-lang]) .lang-en { display: none !important; }

  /* 双语块可选装饰：给当前语言加一条左侧标记 */
  .lang-zh, .lang-en { border-left: 2px solid transparent; }
  html[data-lang="zh"] .lang-zh,
  html[data-lang="en"] .lang-en { border-left-color: #ffb454; padding-left: .9rem; }
</style>

<!-- ③ 切换脚本 -->
<script src="{{ '/assets/js/i18n.js' | relative_url }}" defer></script>
