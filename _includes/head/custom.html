<!-- =========================================================
     bi4wms · v6 首屏预置（不是第二套切换引擎）
     ---------------------------------------------------------
     全站唯一的中英切换引擎在 _layouts/default.html 末尾（v6）：
     按钮、DICT、data-zh、正文双块、目录同步全部由它负责。

     这里只做两件不能等到页面末尾才做的事：
       1) 首屏渲染前定好 html[data-lang]，避免语言闪动；
       2) 用 class 选择器先按语言显示/隐藏双语块，
          避免加载期间中英文同时出现。
     v6 启动后会按自己的逻辑再算一次，两者结果一致。
     ========================================================= -->
<style id="bi-i18n-preflight">
  .bi-lang-zh, [data-bi-lang="zh"], .bi-lang-mark { display: none !important; }
  html[data-lang="zh"] .bi-lang-en,
  html[data-lang="zh"] [data-bi-lang="en"] { display: none !important; }
  html[data-lang="zh"] .bi-lang-zh,
  html[data-lang="zh"] [data-bi-lang="zh"] { display: block !important; }
</style>
<script>
(function () {
  var lang = null;
  try { lang = localStorage.getItem("bi4wms-lang"); } catch (e) {}
  if (lang !== "zh" && lang !== "en") {
    var nav = navigator.language || navigator.userLanguage || "";
    lang = nav.toLowerCase().indexOf("zh") === 0 ? "zh" : "en";
  }
  document.documentElement.setAttribute("data-lang", lang);
  document.documentElement.setAttribute("lang", lang === "zh" ? "zh-CN" : "en");
})();
</script>

<!-- =========================================================
     Google Analytics 4 + Google 同意模式 v2（Consent Mode v2）
     ---------------------------------------------------------
     只在生产构建（JEKYLL_ENV=production）输出，本地预览不发送数据。
     analytics_storage / ad_storage / ad_user_data / ad_personalization
     默认全部 denied；只有访客在 _includes/footer/custom.html 的
     双语同意横幅里点了「同意统计」，才会 gtag('consent','update') 放开。
     ========================================================= -->
{% if jekyll.environment == "production" and site.ga4_measurement_id and site.ga4_measurement_id != "" %}
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){window.dataLayer.push(arguments);}
  gtag("consent", "default", {
    "ad_storage": "denied",
    "ad_user_data": "denied",
    "ad_personalization": "denied",
    "analytics_storage": "denied",
    "functionality_storage": "granted",
    "security_storage": "granted",
    "wait_for_update": 500
  });
  /* 回访访客：恢复此前在本站保存的选择 */
  (function () {
    try {
      if (localStorage.getItem("bi4wms-consent-v2") === "granted") {
        gtag("consent", "update", {
          "analytics_storage": "granted",
          "ad_storage": "granted",
          "ad_user_data": "granted",
          "ad_personalization": "granted"
        });
      }
    } catch (e) {}
  })();
</script>
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.ga4_measurement_id }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){window.dataLayer.push(arguments);}
  gtag("js", new Date());
  gtag("config", "{{ site.ga4_measurement_id }}", { "anonymize_ip": true });
</script>
{% endif %}

<!-- Google AdSense：仅在 _config.yml 里填了 adsense_client 时才输出。
     现在保持空值 = 不加载任何广告脚本；ads.txt 已写入真实 pub ID，
     等 AdSense 后台把本站添加为站点并通过审核后，填
     ca-pub-9388766068727097 即可自动加上验证 meta 与 adsbygoogle.js。 -->
{% if site.adsense_client and site.adsense_client != "" %}
<meta name="google-adsense-account" content="{{ site.adsense_client }}">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client={{ site.adsense_client }}" crossorigin="anonymous"></script>
{% endif %}
