<!-- =========================================================
     bi4wms · v6 首屏预置（不是第二套切换引擎）
     ---------------------------------------------------------
     全站唯一的中英切换引擎在 _layouts/default.html 末尾（v6）：
     按钮、DICT、data-zh、正文双块、目录同步全部由它负责。

     这里只做两件不能等到页面末尾才做的事：
       1) 首屏渲染前定好 html[data-lang]，避免语言闪动；
       2) 用 class 选择器先按语言显示/隐藏双语块，
          避免加载期间中英文同时出现。
     v6 启动后会按自己的逻辑再算一次，两者结果一致。
     ========================================================= -->
<style id="bi-i18n-preflight">
  .bi-lang-zh, [data-bi-lang="zh"], .bi-lang-mark { display: none !important; }
  html[data-lang="zh"] .bi-lang-en,
  html[data-lang="zh"] [data-bi-lang="en"] { display: none !important; }
  html[data-lang="zh"] .bi-lang-zh,
  html[data-lang="zh"] [data-bi-lang="zh"] { display: block !important; }
</style>
<script>
(function () {
  var lang = null;
  try { lang = localStorage.getItem("bi4wms-lang"); } catch (e) {}
  if (lang !== "zh" && lang !== "en") {
    var nav = navigator.language || navigator.userLanguage || "";
    lang = nav.toLowerCase().indexOf("zh") === 0 ? "zh" : "en";
  }
  document.documentElement.setAttribute("data-lang", lang);
  document.documentElement.setAttribute("lang", lang === "zh" ? "zh-CN" : "en");
})();
</script>
